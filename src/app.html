<title>Büfé CRM</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one-column phone app, sticky header, bottom tab bar; market-stall green with mustard highlights */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --surface2:#e8ece4; --fg:#1b241d; --muted:#5d6b60; --line:#d3dacf;
  --accent:#0f6b47; --accent-fg:#ffffff; --accent-soft:#d8ecdf; --mustard:#e4a92a; --mustard-soft:#fbefd2;
  --warn:#9a6200; --warn-soft:#fdf0d4; --danger:#b3261e; --danger-soft:#fbe1de; --ok:#1d7a3e;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
  --ice:#b9dcf2; --ice-bg:#f0f8fd; --ice-line:#7db7dc; --bun:#dc9a4c; --bun-dk:#a5622a; --bun-lt:#f3cf98; --sausage:#c4553a; --sausage-dk:#7e2c1a; --sausage-lt:#ec9a83;
  --d1:#eef6f0; --d2:#eef3f8; --d3:#f5f0f8; --d4:#fbf3e6; --d5:#f8eeee; --d6:#eef6f6; --d0:#f6f4ec;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121713; --surface:#1b221d; --surface2:#253028; --fg:#e7ede8; --muted:#9db0a2; --line:#334037;
  --accent:#4fbf8a; --accent-fg:#0d1a12; --accent-soft:#1f3a2b; --mustard:#f0bd4f; --mustard-soft:#3a2f14;
  --warn:#f0bd4f; --warn-soft:#3a2f14; --danger:#ff8a80; --danger-soft:#43201d; --ok:#6fd49a; --d1:#1b261f; --d2:#1b2129; --d3:#241d29; --d4:#2a2418; --d5:#2a1d1d; --d6:#1a2626; --d0:#24231b; --ice:#2b4a61; --ice-bg:#15232d; --ice-line:#3f7aa0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121713; --surface:#1b221d; --surface2:#253028; --fg:#e7ede8; --muted:#9db0a2; --line:#334037;
  --accent:#4fbf8a; --accent-fg:#0d1a12; --accent-soft:#1f3a2b; --mustard:#f0bd4f; --mustard-soft:#3a2f14;
  --warn:#f0bd4f; --warn-soft:#3a2f14; --danger:#ff8a80; --danger-soft:#43201d; --ok:#6fd49a; --d1:#1b261f; --d2:#1b2129; --d3:#241d29; --d4:#2a2418; --d5:#2a1d1d; --d6:#1a2626; --d0:#24231b; --ice:#2b4a61; --ice-bg:#15232d; --ice-line:#3f7aa0; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--body);-webkit-text-size-adjust:100%}
#app{max-width:640px;margin:0 auto;padding:0 16px 96px;min-height:100%}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.35rem;font-weight:800}
h3{font-size:1.05rem;font-weight:600}
html{scroll-padding-top:96px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 0 10px;border-bottom:1px solid var(--line);margin-bottom:14px}
.brand{font-family:var(--display);font-weight:800;font-size:1.3rem;flex:1;min-width:0}
.hlogo{flex:0 0 auto;width:54px;height:54px;margin:-6px 0}
.hright{flex:1;display:flex;align-items:center;justify-content:flex-end;gap:8px;min-width:0}
.who{white-space:nowrap}
.brand small{display:block;font:400 .78rem var(--body);color:var(--muted);letter-spacing:0}
.who{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;font:inherit;font-size:.9rem;cursor:pointer}
.badge{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--mustard-soft);color:var(--warn)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{min-width:0}
.grow{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.num{font-variant-numeric:tabular-nums}
.label{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface2);color:var(--fg);border-radius:10px;padding:9px 14px;font-weight:700;min-height:44px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.warn{background:var(--mustard);border-color:var(--mustard);color:#2b1d00}
.btn.dng{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:6px 10px;font-size:.9rem}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.who:focus-visible,.tab:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:44px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:.82rem;color:var(--muted);font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:380px){.grid2{grid-template-columns:1fr}}
.fzbox{border:2px solid var(--ice-line);border-radius:calc(var(--r) + 4px);background:var(--ice-bg);padding:0 8px 8px;overflow:hidden}
.fzhead{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 -8px 8px;padding:6px 10px;background:var(--ice-line);color:#fff;font:800 .95rem var(--display);letter-spacing:.18em;text-shadow:0 1px 0 rgba(0,0,0,.18)}
.fzhead .fzflake{display:inline-flex;width:18px;height:18px;color:#fff}
.fzhead .fzflake svg{width:18px;height:18px}
.fzbox .fzsel{border-color:var(--ice)}
.fzhead.fzh2{justify-content:space-between}
.fzh2 .fzl{display:inline-flex;align-items:center;gap:8px}
.fzh2 .fzdt{font:700 .8rem system-ui,sans-serif;letter-spacing:0;opacity:.95}
.brand.inco{font:600 .78rem ui-monospace,Menlo,Consolas,monospace;color:var(--muted);letter-spacing:.06em;line-height:1.5}
.brand.inco b{color:var(--fg);font-weight:700}
.freezer{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fz{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.fz .n{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}
.fz .nm{font-size:.8rem;color:var(--muted);font-weight:700;text-align:center}
.fz .pm{display:flex;gap:6px;width:100%}
.fz .pm button{flex:1;min-height:40px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);color:var(--fg);font-weight:800;font-size:1.15rem}
.fzsel{position:relative;cursor:pointer;border:2px solid var(--ice-line);background:var(--ice-bg);overflow:hidden;gap:2px;padding:8px 6px}
.fzsel>*{position:relative;z-index:1}
.fzsel .flake{position:absolute;z-index:0;inset:50% auto auto 50%;width:118%;height:auto;transform:translate(-50%,-50%);color:var(--ice);pointer-events:none}
.fzsel .bk{width:60px;height:38px}
.fzsel select{position:absolute;inset:0;opacity:0;width:100%;height:100%;min-height:0;cursor:pointer;z-index:2}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.fzsel:focus-within{outline:3px solid var(--mustard);outline-offset:2px}
.bake{border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.bake.todo{background:var(--danger);border-color:var(--danger);color:#fff}
.bake>button{width:100%;display:flex;align-items:center;gap:8px;border:0;background:none;color:inherit;font:inherit;font-weight:700;padding:10px 14px;text-align:left;min-height:44px}
.bake .body{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.bake .body select{background:var(--surface);color:var(--fg)}
.bake .body .field>span{color:inherit;opacity:.9}
.fz .fix{border:0;background:none;color:var(--muted);font-size:.78rem;text-decoration:underline;padding:2px}
.note{border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center;font-weight:700}
.note.w{background:var(--warn-soft);color:var(--warn)}
.note.d{background:var(--danger-soft);color:var(--danger)}
.note.i{background:var(--accent-soft);color:var(--accent)}
.note .grow{font-weight:700}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li>.grow{min-width:0}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:.78rem;font-weight:700;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--accent-soft);color:var(--ok)}
.pill.w{background:var(--warn-soft);color:var(--warn)}
.pill.d{background:var(--danger-soft);color:var(--danger)}
.time{font-family:var(--display);font-weight:800;font-size:1.25rem;font-variant-numeric:tabular-nums;min-width:58px}
.day{display:flex;flex-direction:column;gap:8px}
.day.closed>*:not(.daydate){opacity:.6}
.dayhead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.dayhead:empty{display:none}
.seg{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;color:var(--muted);padding:8px 6px;border-radius:8px;font-weight:700;min-height:40px}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{display:flex;max-width:640px;width:100%}
.tab{flex:1;border:0;background:none;color:var(--muted);padding:8px 2px 10px;font-size:.75rem;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--accent)}
.tab .dot{position:absolute;top:5px;left:calc(50% + 8px);min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;font-size:.7rem;line-height:18px;padding:0 4px}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl td,.tbl th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
.tbl th{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tbl td.r,.tbl th.r{text-align:right}
.scroll{overflow-x:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;z-index:20;max-width:calc(100% - 32px)}
.alarm{position:fixed;inset:0;z-index:30;background:rgba(10,14,11,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.alarm .box{background:var(--surface);border:3px solid var(--mustard);border-radius:16px;padding:20px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:12px;animation:pulse 1.2s ease-in-out infinite}
.alarm .big{font-family:var(--display);font-weight:800;font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
@keyframes pulse{50%{border-color:var(--danger)}}
@media (prefers-reduced-motion:reduce){.alarm .box{animation:none}}
.menu{display:flex;flex-direction:column;gap:8px}
.menu button{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;color:var(--fg);font-weight:700}
.menu button span.grow{display:flex;flex-direction:column}
.menu button small{font-weight:400;color:var(--muted)}
.back{border:0;background:none;color:var(--accent);font-weight:700;padding:4px 0;align-self:flex-start}
.empty{color:var(--muted);text-align:center;padding:14px 6px}
.chk{display:flex;gap:8px;align-items:center;font-weight:700}
.chk input{width:22px;min-height:22px;height:22px}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.dcard.noshift{border-color:var(--danger);border-width:2px}
.dcard.closed .dmeta{opacity:.8}
.daydate{padding:5px 8px 5px 12px;background:#7fcf9c;color:#000;display:flex;align-items:center;gap:8px;min-height:36px}
.daydate .dnum{font-family:var(--display);font-weight:800;font-size:1.1rem;line-height:1;font-variant-numeric:tabular-nums}
.daydate .dname{font-family:var(--display);font-weight:800;font-size:.95rem;text-transform:uppercase;letter-spacing:.04em}
.dadd{margin-left:auto;width:30px;height:30px;border-radius:8px;border:0;background:rgba(0,0,0,.14);color:#000;font:800 1.3rem/1 var(--display);cursor:pointer}
.dbody{display:flex;flex-wrap:wrap;gap:6px;padding:7px 10px}
.sbtn{border:0;font:inherit;cursor:pointer;min-height:30px}
.nobody{color:var(--danger);font-weight:700;font-size:.88rem}
.dmeta{display:flex;flex-wrap:wrap;gap:4px 12px;padding:0 10px 7px;font-size:.75rem;color:var(--muted)}
.lnk{border:0;background:none;padding:0;color:var(--accent);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
.sfgrid{display:grid;grid-template-columns:1.2fr 1fr 1fr 44px;gap:6px;align-items:end}
.sfplus{height:44px;width:44px;border-radius:10px;border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent);font:800 1.6rem/1 var(--display);cursor:pointer;padding:0}
.dform{padding:8px 10px 10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.daydate.cl{background:#ef7a70;color:#000}
.daydate .zar{font-family:var(--display);font-weight:800;font-size:.95rem;text-transform:uppercase;letter-spacing:.04em;margin-left:auto}
.daydate .today{font-size:.75rem;font-weight:700;background:#000;color:#fff;border-radius:999px;padding:2px 8px;letter-spacing:.06em;text-transform:uppercase}
.daydate .pill{margin-left:auto}
.msgcard{background:var(--danger);color:#fff;border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px;cursor:pointer;border:0;text-align:left;font:inherit;width:100%}
.shiftbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px}
.schip{background:var(--accent-soft);color:var(--fg);border-radius:999px;padding:3px 10px;font-size:.88rem;white-space:nowrap}
.shiftbar{cursor:pointer}
.cntsel{position:relative;display:flex;flex-direction:column;align-items:center;border:2px solid var(--accent);border-radius:10px;padding:4px 2px;background:var(--accent-soft);cursor:pointer}
.cntsel select{position:absolute;inset:0;opacity:0;width:100%;height:100%;min-height:0;cursor:pointer}
.cntsel:focus-within{outline:3px solid var(--mustard);outline-offset:2px}
.btn.nofz{background:var(--danger);border-color:var(--danger);color:#fff}
.bkgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.frrow{display:grid;grid-template-columns:1.3fr 1fr auto;gap:6px;align-items:center}
.alarm .box.calm{animation:none;border-color:var(--accent);max-height:calc(100vh - 32px);overflow:auto}
.congrats{font-size:1.05rem}
.bakebar{cursor:default}
.shiftbar.sb-today{border:2px solid var(--accent);border-left-width:6px}
.shiftbar.sb-today .label{color:var(--accent)}
.shiftbar.sb-today .schip{background:var(--accent);color:var(--accent-fg)}
.shiftbar.sb-tmrw{background:transparent;border-style:dashed}
.shiftbar.sb-tmrw .schip{background:var(--surface2);color:var(--muted)}
.shiftbar.sb-tmrw .schip b{font-weight:700}
.msgwrap{display:flex;gap:6px;align-items:stretch}
.msgcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.msgnew{flex:0 0 40px;border:2px solid var(--danger);background:var(--danger-soft);color:var(--danger);border-radius:var(--r);font:800 2rem/1 var(--display);cursor:pointer;padding:0}
.msgrow{display:flex;gap:6px;align-items:stretch}
.msgrow .msgcard{flex:1;min-width:0}
.msgrow{position:relative}
.msgok{position:absolute;top:6px;right:8px;z-index:1;height:24px;min-width:44px;padding:0 10px;font-size:.85rem!important;line-height:1;border:2px solid #fff;border-radius:999px;background:#fff;color:var(--danger);font:inherit;font-weight:800;font-size:1rem;cursor:pointer}
.msgrow .msgcard{padding:7px 12px 8px;gap:1px}
.msgrow .msgcard .meta{padding-right:58px;font-size:.75rem;line-height:20px}
.msgrow .msgcard .txt{line-height:1.3}
.msgcol{gap:4px!important}
.msgcard .meta{font-size:.8rem;opacity:.9}
.msgcard .txt{font-weight:700;white-space:pre-wrap;word-break:break-word}
.wallbtn{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);background:var(--accent-soft);color:var(--accent);border-radius:var(--r);padding:12px 14px;font:inherit;font-weight:700;text-align:left;min-height:48px}
.day.empty{border-color:var(--danger);border-width:2px}
.item{display:flex;flex-direction:column;gap:10px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.item:first-child{border-top:0}
.item.open{cursor:default}
.item .head{display:flex;gap:10px;align-items:center}
.item .head>.grow{min-width:0}
.item .chev{color:var(--muted);font-size:1.2rem;transition:transform .15s}
.item.open .chev{transform:rotate(90deg)}
.qsel{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;border:2px solid var(--accent);border-radius:12px;padding:12px 14px;background:var(--accent-soft);color:var(--fg);font-weight:700;font-size:1.1rem}
.qsel select{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;min-height:0}
.qsel:focus-within{outline:3px solid var(--mustard);outline-offset:2px}
.sortseg{margin-bottom:-4px}
.drag{touch-action:none;cursor:grab;font-size:1.4rem;line-height:1;color:var(--muted);padding:6px 8px 6px 0;user-select:none;-webkit-user-select:none}
.item.dragging{background:var(--accent-soft);border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.18);position:relative;z-index:3}
.item.dragging .drag{cursor:grabbing;color:var(--accent)}
.crow{align-items:center}
.mcol{flex:0 0 34px;height:34px;display:flex;align-items:center;justify-content:center}
.medal{width:34px;height:34px}
.tpill{display:inline-block;font:800 .66rem var(--body);letter-spacing:.06em;padding:2px 7px;border-radius:999px;margin:3px 4px 0 0}
.tpill.wk{background:var(--mustard-soft);color:var(--warn);border:1px solid var(--mustard)}
.tpill.mo{background:var(--accent);color:var(--accent-fg)}
.tpill.qt{background:#5b3fa8;color:#fff}
.tpill.yr{background:linear-gradient(90deg,#8a1c14,#b3261e);color:#ffe9a8;border:1px solid #e4a92a}
.tpill.at{background:linear-gradient(90deg,#111,#3a2a00 40%,#e4a92a 50%,#3a2a00 60%,#111);background-size:250% 100%;color:#ffe17a;border:1px solid #e4a92a;font-size:.7rem;padding:3px 9px;animation:atshine 3s linear infinite}
@keyframes atshine{from{background-position:100% 0}to{background-position:-150% 0}}
@media (prefers-reduced-motion:reduce){.tpill.at{animation:none}}
.celeb{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;transition:opacity .35s}
.celeb.out{opacity:0}
.celeb canvas{position:absolute;inset:0;pointer-events:none}
.celeb.lv-all{background:rgba(6,4,18,.82)}
.celeb.lv-year{background:rgba(25,0,0,.55)}
.celeb.lv-quarter{background:rgba(20,10,50,.25)}
.celeb .cbox{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 22px;border-radius:18px;max-width:420px}
.celeb.lv-week .cbox{background:var(--surface);border:3px solid #e4a92a;box-shadow:0 10px 30px rgba(0,0,0,.25)}

function beep(){
  try{
    if(!actx) return;
    const t0 = actx.currentTime;
    [0,0.35,0.7].forEach((o,i) => { const os = actx.createOscillator(), g = actx.createGain(); os.type="square"; os.frequency.value = i===2?1046:880; g.gain.setValueAtTime(0.0001,t0+o); g.gain.exponentialRampToValueAtTime(0.25,t0+o+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+o+0.28); os.connect(g).connect(actx.destination); os.start(t0+o); os.stop(t0+o+0.3); });
  }catch(e){}
  try{ navigator.vibrate && navigator.vibrate([400,150,400,150,600]); }catch(e){}
}
const pickupTs = o => parseYmd(o.date).getTime() + (+o.time.slice(0,2))*3600000 + (+o.time.slice(3,5))*60000;
const remindTs = o => pickupTs(o) - (Number(o.remindMin)||30)*60000;
function dueOrders(){ const now = Date.now(); return S.orders.filter(o => o.status === "nyitott" && now >= remindTs(o) && now < pickupTs(o) + 3*3600000); }

const KREM_ID = () => "krem-" + today();
const INV_ID = () => "inv-" + today();
const CASH_ID = () => "cash-" + today();

function kremDue(){
  const d = new Date(), wd = d.getDay();
  if((wd !== 1 && wd !== 4) || isClosed(today())) return false;
  if(d.getHours()*60 + d.getMinutes() < 10*60+50) return false;

  return kr.length > 0 && kr.some(i => i.lastCountDate !== today());
}

function alarmTick(){
  const now = Date.now(); if(isReadonly() || S.needLogin || !S.me || !meStaff() || S.pinFor){ if(isReadonly()) clearNativeNotifs(); if(S.alarmFor){ S.alarmFor = null; renderAlarm(); } return; } nativeSched();

  let next = due[0];
  if(!next && invDue() && !(S.snooze[INV_ID()] > now)) next = { id: INV_ID() };
  if(!next && cashDue() && !(S.snooze[CASH_ID()] > now) && S.sub !== "cash") next = { id: CASH_ID() };
  if(!next && kremDue() && !(S.snooze[KREM_ID()] > now)) next = { id: KREM_ID() };
  if(!next && bakeCloseDue() && !(S.snooze["bake-"+today()] > now)) next = { id: "bake-"+today() };
  if(S.close){ document.title = "Büfé CRM"; return; }
  if(next){
    if(S.alarmFor !== next.id){ S.alarmFor = next.id; renderAlarm(); }
    if(!lastBeep[next.id] || now - lastBeep[next.id] >= 5*60000 - 1000){ lastBeep[next.id] = now; beep(); }
  } else if(S.alarmFor){ S.alarmFor = null; renderAlarm(); }

}

const LN = () => { const C = window.Capacitor; return C && C.isNativePlatform && C.isNativePlatform() && C.Plugins && C.Plugins.LocalNotifications; };
let nSig = "", nBusy = false, nInit = false;

async function clearNativeNotifs(){ const ln = LN(); if(!ln || nCleared) return; nCleared = true; nSig = ""; try{ const pend = await ln.getPending(); if(pend && pend.notifications && pend.notifications.length) await ln.cancel({notifications: pend.notifications.map(n => ({id:n.id}))}); }catch(e){} }
async function nativeSched(){ nCleared = false;
  const ln = LN(); if(!ln || nBusy || !S.dbOk || BACKEND!=="fb") return;
  const now = Date.now(), horizon = now + 7*86400000, list = [];
  const add = (at, title, body) => { if(at > now + 5000 && at < horizon) list.push({at, title, body}); };
  S.orders.filter(o => o.status === "nyitott" && o.date && o.time).forEach(o => { const r = remindTs(o), pu = pickupTs(o);
    for(let t = r, i = 0; t <= pu && i < 10; t += 5*60000, i++) add(t, "⏰ Előrendelés " + o.time, (o.name||"") + (o.items ? " – " + o.items : "")); });
  const hasKrem = S.items.some(i => i.krem);
  for(let k = 0; k < 7; k++){ const dd = addDays(new Date(), k), ds = ymd(dd); if(isClosed(ds)) continue;
    const base = new Date(dd.getFullYear(), dd.getMonth(), dd.getDate(), 10, 50).getTime();
    if(hasKrem && (dd.getDay() === 1 || dd.getDay() === 4) && !(k === 0 && !kremDue() && now >= base)){ const done = k === 0 && S.items.filter(i=>i.krem).every(i => i.lastCountDate === ds); if(!done) for(let i = 0; i < 4; i++) add(base + i*5*60000, "⏰ Krémleltár!", "Hétfő/csütörtök 10:50 – számold meg a krémeket."); }
    if(canCash() && !isReadonly() && S.cashLoaded && shiftOf(ds).some(e => e.staffId === S.me)){ const b11 = new Date(dd.getFullYear(), dd.getMonth(), dd.getDate(), 11, 0).getTime(); if(!(k === 0 && !cashDue() && now >= b11)){ const tc = k===0 && S.cash.find(x=>x.date===ds); if(!(tc && tc.close!=null && tc.close!=="")) add(b11, "⏰ Mehet a kasszazárás?", "11:00 – nyisd meg az appot a kasszazáráshoz."); } }
    if(dd.getDay() === 1 || dd.getDay() === 4 || isMonthlyInvDay(ds)){ const b10 = new Date(dd.getFullYear(), dd.getMonth(), dd.getDate(), 10, 0).getTime();
      if(!(k === 0 && !leltarPending())) for(let i = 0; i < 4; i++) add(b10 + i*15*60000, "⏰ Leltár ma!", (isMonthlyInvDay(ds) ? "Havi leltár" : dd.getDay()===1 ? "Hétfői teljes leltár" : "Csütörtöki részleges leltár") + " – indítsd el az appban."); }
    if(k === 0){ const doc = bakeDoc(ds); if(!(doc && doc.remaining) && (hasArrived(doc) || Object.keys(openingFor(ds)).length)) for(let i = 0; i < 3; i++) add(base + 5*60000 + i*5*60000, "⏰ Pékáru zárás", "10:55 – írd be a maradékot."); }
  }

    if(!nInit){ nInit = true; try{ await ln.requestPermissions(); }catch(e){} try{ await ln.createChannel({id:"alarm", name:"Riasztások", importance:5, visibility:1, vibration:true}); }catch(e){} }
    const pend = await ln.getPending(); if(pend && pend.notifications && pend.notifications.length) await ln.cancel({notifications: pend.notifications.map(n => ({id:n.id}))});
    if(sel.length) await ln.schedule({notifications: sel.map((n, i) => ({id: i + 1, title: n.title, body: n.body, channelId: "alarm", schedule: {at: new Date(n.at), allowWhileIdle: true}}))});
    nSig = sig;
  }catch(e){ console.warn("notif", e); }
  nBusy = false;
}

/* ---------- derived ---------- */
function shiftOf(date){ return (S.shifts[date] && S.shifts[date].entries) || []; }
function bonusOf(ds){ const wd = parseYmd(ds).getDay(), n = shiftOf(ds).length; let b = 0; if((wd === 5 || wd === 6 || wd === 0) && n >= 1 && n <= 2) b += 1; if(wd === 6 || wd === 0) b += 1; return b; }
const bonusTag = ds => { const b = bonusOf(ds); return b ? ` <span class="bon" title="Plusz fizetett óra">+${b}</span>` : ""; };
function hoursOf(e){ const t = s => (+s.slice(0,2)) + (+s.slice(3,5))/60; return Math.max(0, t(e.end) - t(e.start)); }
function weekStart(off){ const d = new Date(); const wd = (d.getDay()+6)%7; d.setHours(0,0,0,0); return addDays(d, -wd + off*7); }
function lowItems(){ return S.items.filter(i => i.min > 0 && (i.stock||0) < i.min); }
const UNITS = ["db","karton","doboz","csomag","üveg","kg","liter"];
function U(it){ return (it && it.unit) || "db"; }
function PC(it){ return U(it)==="db" ? (Number(it.perCarton)||0) : 0; }
function fmtQty(q, it){ if(U(it)!=="db") return `${fmtN(q)} ${U(it)}`; const pc = PC(it); if(pc > 1){ const k = Math.floor(q/pc + 1e-9), r = Math.round((q - k*pc)*100)/100; return k ? `${k} karton ${r ? fmtN(r)+" db" : ""}`.trim() : `${fmtN(r)} db`; } return `${fmtN(q)} db`; }
function monthEndInvDay(y, m){ let d = new Date(y, m+1, 0); while(d.getDay() !== 4) d = addDays(d, -1); for(; d.getMonth() === m; d = addDays(d, -1)){ const s = ymd(d); if(!isClosed(s)) return s; } return null; }
function isMonthlyInvDay(ds){ const d = parseYmd(ds); return monthEndInvDay(d.getFullYear(), d.getMonth()) === ds; }
function leltarToday(){
  const wd = new Date().getDay();
  if(isClosed(today())) return null;
  if(isMonthlyInvDay(today())){ const extra = wd === 1 ? (i => i.monday !== false) : wd === 4 ? (i => i.partial || i.krem) : (() => false);
    return { name:"Havi leltár (hónap utolsó csütörtöke)", items: S.items.filter(i => i.monthly !== false || extra(i)) }; }
  if(wd === 1) return { name:"Teljes leltár (hétfő)", items: S.items.filter(i => i.monday !== false) };
  if(wd === 4) return { name:"Részleges leltár (csütörtök)", items: S.items.filter(i => i.partial || i.krem) };
  return null;
}
function leltarPending(){ const l = leltarToday(); if(!l || !l.items.length) return 0; return l.items.filter(i => i.lastCountDate !== today()).length; }
function uncoveredDays(){ const out = []; for(let i=0;i<7;i++){ const s = ymd(addDays(new Date(), i)); if(!isClosed(s) && !shiftOf(s).length) out.push(s); } return out; }
function liveMsgs(){ const t = today(); return S.msgs.filter(m => !m.deleted && !(m.showFrom && m.showFrom > t)); }
function scheduledMsgs(){ const t = today(); return S.msgs.filter(m => !m.deleted && m.showFrom && m.showFrom > t).sort((a,b)=> a.showFrom<b.showFrom?-1:1); }
function unreadMsgs(){ return liveMsgs().filter(m => !(m.readBy && m.readBy[S.me]) && m.by !== S.me).length; }
function openReqs(){ return S.reqs.filter(r => r.status === "nyitott" && r.date >= today()); }
function prevCash(date){ return S.cash.filter(c => c.date < date && c.close!=null && c.close!=="").sort((a,b)=> a.date < b.date ? 1 : -1)[0]; }
function cashCalc(c, prev){
  const exp = (c.exp||[]).reduce((a,e)=> a + num(e.amt), 0), wd = (c.wd||[]).reduce((a,e)=> a + num(e.amt), 0);
  if(!prev || c.close==="" || c.close==null) return { exp, wd, cashT:null, total:null };
  const cashT = num(c.close) - num(prev.close) + exp + wd;
  return { exp, wd, cashT, total: cashT + num(c.card) };
}

}

function incognitoCode(){
  if(BACKEND!=="fb" || !S.me || !(S.me === "tamas" || roleOf(meStaff()) === "owner") || !unlocked()) return "";
  const L = ["V","H","K","S","C","P","S"], out = [];
  for(let i = 0; i < 60 && out.length < 3; i++){ const d = ymd(addDays(new Date(), -i)), c = S.cash.find(x=>x.date===d), t = c ? cashTotal(c) : null;
    if(t != null) out.push(L[parseYmd(d).getDay()] + Math.max(0, Math.round(t/1000))); }
  if(!out.length) return "";
  return `<span aria-hidden="true"><b>${out[0]}</b>${out[1]?" "+out[1]:""}<br>${out[2]?out[2]+" · ":""}<span style="opacity:.6">v2.6</span></span>`;
}
function header(sub){
  const m = meStaff();
  const code = !sub ? incognitoCode() : "";
  if(code) return `<header class="top"><div class="brand inco">${code}</div>
  <img class="hlogo" src="${LOGO}" alt="Piac Büfé" width="54" height="54">
  <div class="hright">${isAdmin()?'<span class="badge">admin</span>':""}
  ${m?`<button class="who" data-act="switchMe" aria-label="Felhasználó váltása">${esc(m.name)} ▾</button>`:""}</div></header>`;
  return `<header class="top"><div class="brand">${sub?esc(sub):"Büfé"}${sub || S.dbOk===false || !S.me || S.needLogin ? `<small>${fmtDay(today())}${S.dbOk===false?" · nincs kapcsolat":""}</small>` : ""}</div>
  <img class="hlogo" src="${LOGO}" alt="Piac Büfé" width="54" height="54">
  <div class="hright">${isAdmin()?'<span class="badge">admin</span>':isReadonly()?'<span class="badge">olvasó</span>':""}
  ${m?`<button class="who" data-act="switchMe" aria-label="Felhasználó váltása">${esc(m.name)} ▾</button>`:""}</div></header>`;
}
function loginView(){
  const mode = S.lgMode || "in", msg = S.loginErr ? `<div class="note d" style="margin-top:10px">${esc(S.loginErr)}</div>` : S.loginOk ? `<div class="note ok" style="margin-top:10px">${esc(S.loginOk)}</div>` : "";
  const em = `<label class="field"><span>E-mail címed</span><input id="lgEm" type="email" autocomplete="username" data-f="f.lgEm" value="${esc(S.f.lgEm||"")}"></label>`;
  const seg = `<div class="seg" role="tablist">${[["in","Belépés"],["reg","Regisztráció"]].map(([k,l])=>`<button class="${mode===k?"on":""}" data-act="lgMode" data-m="${k}" role="tab" aria-selected="${mode===k}">${l}</button>`).join("")}</div>`;
  if(mode === "forgot") return header() + `<section class="card"><h3>Elfelejtett jelszó</h3><p class="muted small">Add meg az e-mail címed. Küldünk egy levelet, amiben új jelszót állíthatsz be.</p>${em}
    <button class="btn pri" style="width:100%" data-act="fbReset">Levél küldése</button>${msg}
    <button class="btn ghost" style="width:100%;margin-top:8px" data-act="lgMode" data-m="in">Vissza a belépéshez</button></section>`;
  if(mode === "reg") return header() + `<div class="stack">${seg}<section class="card"><h3>Regisztráció</h3><p class="muted small">Azzal az e-mail címmel regisztrálj, amit az adminnak megadtál. Utána kapsz egy megerősítő levelet.</p>${em}
    <label class="field"><span>Jelszó (legalább 6 karakter)</span><input id="lgPw" type="password" autocomplete="new-password" data-f="f.lgPw" value=""></label>
    <label class="field"><span>Jelszó még egyszer</span><input id="lgPw2" type="password" autocomplete="new-password" data-f="f.lgPw2" value=""></label>
    <button class="btn pri" style="width:100%" data-act="fbRegister">Regisztrálok</button>${msg}</section></div>`;
  return header() + `<div class="stack">${seg}<section class="card"><h3>Bejelentkezés</h3><p class="muted small">A saját e-mail címeddel és jelszavaddal lépj be. A telefon megjegyzi, nem kell minden nap újra.</p>${em}
  <label class="field"><span>Jelszó</span><input id="lgPw" type="password" autocomplete="current-password" data-f="f.lgPw" value=""></label>
  <button class="btn pri" style="width:100%" data-act="fbLogin">Belépés</button>${msg}
  <button class="btn ghost" style="width:100%;margin-top:8px" data-act="lgMode" data-m="forgot">Elfelejtettem a jelszavam</button></section></div>`;
}
function verifyView(){
  return header() + `<section class="card"><h3>Erősítsd meg az e-mail címed</h3><p>Küldtünk egy levelet ide: <b>${esc(S.authEmail)}</b>. Nyisd meg, és kattints a benne lévő linkre. (Ha nem találod, nézd meg a Spam / Promóciók mappát is.)</p>
  <button class="btn pri" style="width:100%" data-act="fbVerified">Megerősítettem, tovább</button>
  <button class="btn" style="width:100%;margin-top:8px" data-act="fbResend">Levél újraküldése</button>
  <button class="btn ghost" style="width:100%;margin-top:8px" data-act="fbLogout">Kilépés</button>${S.loginErr?`<div class="note d" style="margin-top:10px">${esc(S.loginErr)}</div>`:""}</section>`;
}
function noAccessView(){
  return header() + `<section class="card"><h3>Nincs hozzáférésed</h3><p>A(z) <b>${esc(S.authEmail)}</b> cím még nincs a büfé munkatársai között.</p><p class="muted small">Kérd meg az admint, hogy a Több → Beállítások → Kollégák listában írja be ezt az e-mail címet a nevedhez. Utána nyomd meg az Újra gombot.</p>
  <button class="btn pri" style="width:100%" data-act="fbRetry">Újra</button>
  <button class="btn ghost" style="width:100%;margin-top:8px" data-act="fbLogout">Kilépés</button></section>`;
}
function view(){
  if(S.needLogin) return loginView();
  if(BACKEND==="fb" && S.needVerify) return verifyView();
  if(BACKEND==="fb" && S.noAccess) return noAccessView();
  if(S.dbOk === null) return header() + `<div class="card"><div class="empty">Adatok betöltése…</div></div>`;
  if(S.dbOk === false) return header() + `<div class="card"><h3>Az adatbázis nem érhető el</h3><p class="muted">${BACKEND==="fb" ? "Ellenőrizd az internetkapcsolatot, majd indítsd újra az appot." : "Nyisd meg az appot bejelentkezve a claude.ai-ban. A közös adatokhoz Tamásnak meg kell osztania veled szerkesztési joggal."}</p></div>`;
  if(BACKEND==="fb" && S.dbOk && (!S.me || !meStaff())) return noAccessView();
  if(S.pinFor) return pinView();
  if(!S.me || !meStaff()) return pickView();
  if(BACKEND==="fb" && needsPin(meStaff()) && !unlocked()){ S.pinFor = S.me; return pinView(); }
  if(S.inv) return invView();
  switch(S.tab){
    case "order": return S.sub==="olog" ? orderLogView() : orderView();
    case "shift": return shiftView();
    case "stock": return stockView();
    case "more": return moreView();
    default: return homeView();
  }
}

function importCard(){ return `<section class="card"><h3>Adatok importálása</h3><p class="small muted">Egyszeri átköltöztetés: válaszd ki a kapott <b>bufe-adatok.json</b> fájlt. A meglévő azonos tételeket felülírja.</p>

const BAKERY = [["kifli","Hot dog kifli"],["zsemle","Hambi zsemle"],["kenyer","Kenyér"]];
function bakeDoc(date){ return S.bakery.find(x=>x.date===date); }
function bArr(doc,k){ if(!doc) return 0; return (doc.arrived ? doc.arrived[k] : doc[k]) || 0; }
function hasArrived(doc){ return !!doc && (!!doc.arrived || doc.kifli!=null); }
function openingFor(date){ const prev = S.bakery.filter(x=>x.date<date && x.remaining).sort((a,b)=> a.date<b.date?1:-1)[0]; return prev ? {...prev.remaining} : {}; }
function bakeStock(date){ const d = bakeDoc(date) || {}, op = d.opening || openingFor(date), ff = d.fromFreezer || {}, out = {}; BAKERY.forEach(([k])=> out[k] = (op[k]||0) + bArr(d,k) + (ff[k]||0)); return out; }
function buffetCount(k){ const d = bakeDoc(today()); if(d && d.remaining) return num(d.remaining[k]||0); return num(bakeStock(today())[k]||0); }
function fzDeltaOptions(k, cur){
  const maxIn = isClosed(today()) ? 50 : Math.max(0, buffetCount(k));
  let h = `<option value="" selected>±</option>`;
  for(let v = -cur; v <= maxIn; v++){ if(v === 0) continue; h += `<option value="${v}">${v > 0 ? "+" + v + " be" : "−" + (-v) + " ki"}</option>`; }
  return h;
}
function bakeLine(obj){ return BAKERY.map(([k,l])=>`${l}: <b>${obj&&obj[k]||0}</b>`).join(" · "); }
async function bakeMerge(date, patch){

  if(i>=0) S.bakery[i] = merged; else S.bakery.unshift(merged); render();

function dayCard(d){
  const closed = isClosed(d), hol = holidayName(d), es = shiftOf(d), doc = S.shifts[d];
  const form = S.shiftForm && S.shiftForm.date === d ? S.shiftForm : null;
  const hist = S.shiftHist && S.shiftHist.date === d ? S.shiftHist : null;
  const dd = parseYmd(d);
  const meta = [];
  const clash = es.filter(e => unavailOn(e.staffId, d)).map(e => staffName(e.staffId));
  if(clash.length && !closed) meta.push(`<span class="unwarn">⚠ ${esc(clash.join(", "))} jelezte, hogy nem ér rá – cseréld!</span>`);
  if(closed) meta.push(`<span>${esc(closedLabel(d))}</span>`);
  else if(hol) meta.push(`<span>${esc(hol)} · nyitva</span>`);
  if(doc && doc.at) meta.push(`<span>Mód.: ${esc(staffName(doc.by))}, ${tsLabel(doc.at)}</span>`);
  if(doc && !closed && !form) meta.push(`<button class="lnk" data-act="shiftHist" data-date="${d}">Előzmények</button>`);
  if((hol || closed) && isAdmin()) meta.push(`<button class="lnk" data-act="dayToggle" data-date="${d}">${closed?"Nyitvára":"Zárvára"}</button>`);
  return `<section class="dcard ${closed?"closed":""} ${!closed&&!es.length?"noshift":""}">
    <div class="daydate ${closed?"cl":""}"><span class="dnum">${MONTHS[dd.getMonth()].slice(0,3)}. ${dd.getDate()}.</span><span class="dname">${DAYS[dd.getDay()]}</span>${d===today()?'<span class="today">ma</span>':""}${closed?'<span class="zar">Zárva</span>':(!form?`<button class="dadd" data-act="shiftAdd" data-date="${d}" aria-label="Beosztás hozzáadása ${fmtDay(d)}">+</button>`:"")}</div>
    ${!closed ? `<div class="dbody">${es.length ? es.map((e,i)=>`<button class="schip sbtn" data-act="shiftEdit" data-date="${d}" data-i="${i}"><b>${esc(staffName(e.staffId))}</b> <span class="num">${e.start}–${e.end}</span>${bonusTag(d)}</button>`).join("") : `<span class="nobody">nincs beosztva</span>`}</div>` : ""}
    ${meta.length?`<div class="dmeta">${meta.join("")}</div>`:""}
    ${form ? `<div class="dform"><div class="sfgrid"><label class="field"><span>Kolléga</span><select id="sfStaff" data-f="shiftForm.staffId">${[...shiftStaffOn(form.date), ...shiftStaff().filter(s=>s.id===form.staffId && unavailOn(s.id, form.date))].map(s=>`<option value="${esc(s.id)}" ${s.id===form.staffId?"selected":""}>${esc(s.name)}</option>`).join("")}</select></label>
      <label class="field"><span>Kezdés</span><select id="sfStart" data-f="shiftForm.start">${STARTS.map(t=>`<option ${t===form.start?"selected":""}>${t}</option>`).join("")}</select></label>
      <label class="field"><span>Vége</span><select id="sfEnd" data-f="shiftForm.end">${ENDS.map(t=>`<option ${t===form.end?"selected":""}>${t}</option>`).join("")}</select></label>
      <button class="sfplus" data-act="shiftSaveAdd" aria-label="Mentés és újabb kolléga felvétele erre a napra" title="Mentés és újabb kolléga">+</button></div>
      <div class="row"><button class="btn pri grow" data-act="shiftSave">Mentés</button>${form.i!=null?`<button class="btn dng" data-act="shiftDel">Törlés</button>`:""}<button class="btn ghost" data-act="shiftCancel">Mégse</button></div></div>` : ""}
    ${hist ? `<div class="dform"><div class="list">${hist.rows===null?`<div class="empty">Betöltés…</div>`:hist.rows.length?hist.rows.map(h=>`<div class="li"><span class="grow small"><b>${esc(staffName(h.by))}</b>, ${tsLabel(h.at)}<br><span class="muted">Előtte: ${(h.before||[]).map(e=>`${esc(staffName(e.staffId))} ${e.start}–${e.end}`).join("; ")||"üres"}</span></span><button class="btn sm" data-act="shiftRestore" data-id="${esc(h.id)}">Visszaállít</button></div>`).join(""):`<div class="empty">Nincs korábbi állapot.</div>`}</div><button class="btn sm ghost" data-act="shiftHistClose">Bezár</button></div>`:""}
  </section>`;
}

function personCalView(){
  const pc = S.personCal, first = new Date(pc.y, pc.m, 1), lead = (first.getDay()+6)%7, n = new Date(pc.y, pc.m+1, 0).getDate();
  let cells = "", hours = 0, days = 0;
  for(let i=0;i<lead;i++) cells += `<div class="c blank"></div>`;
  for(let dn=1; dn<=n; dn++){
    const ds = `${pc.y}-${pad(pc.m+1)}-${pad(dn)}`, e = shiftOf(ds).find(x=>x.staffId===pc.id), cl = isClosed(ds);
    if(e){ hours += hoursOf(e) + bonusOf(ds); days++; }
    cells += `<div class="c ${e?"on":""} ${cl?"off":""}"><span class="dn">${dn}</span>${e?`<span class="tm">${e.start}<br>${e.end}</span>`:cl?'<span class="muted">zárva</span>':""}</div>`;
  }
  const list = [];
  for(let dn=1; dn<=n; dn++){ const ds = `${pc.y}-${pad(pc.m+1)}-${pad(dn)}`, e = shiftOf(ds).find(x=>x.staffId===pc.id); if(e) list.push([ds,e]); }
  return header("Műszak") + `<div class="stack"><button class="back" data-act="personCalClose">‹ Vissza a heti nézethez</button>
    <section class="card"><h2>${esc(staffName(pc.id))}</h2>
    <div class="row"><button class="btn sm" data-act="personMonth" data-d="-1" aria-label="Előző hónap">‹</button><b class="grow" style="text-align:center">${pc.y}. ${MONTHS[pc.m]}</b><button class="btn sm" data-act="personMonth" data-d="1" aria-label="Következő hónap">›</button></div>
    <div class="pcal">${["H","K","Sze","Cs","P","Szo","V"].map(h=>`<div class="h">${h}</div>`).join("")}${cells}</div>
    <div class="row"><span class="pill ok">${days} nap</span><span class="pill ok">${fmtN(hours)} óra</span></div></section>
    ${list.length?`<section class="card"><h3>Ledolgozott napok</h3><div class="list">${list.map(([ds,e])=>`<div class="li"><span class="grow">${fmtDay(ds)}</span><b class="num">${e.start}–${e.end}</b><span class="small muted num">${fmtN(hoursOf(e))} ó${bonusOf(ds)?` + ${bonusOf(ds)}`:""}</span></div>`).join("")}</div></section>`:`<div class="card"><div class="empty">Ebben a hónapban nincs beosztása.</div></div>`}
  </div>`;

function qtyInputs(prefix, it){
  const pc = PC(it);
  return `<div class="${pc>1?"grid2":""}">${pc>1?`<label class="field"><span>Karton (${pc} db/karton)</span><input id="${prefix}K" type="number" inputmode="numeric" min="0" step="1" data-f="f.${prefix}K" value="${esc(S.f[prefix+"K"]??"")}"></label>`:""}
  <label class="field"><span>${U(it)!=="db"?U(it)[0].toUpperCase()+U(it).slice(1):it.krem?"Doboz (egész)":"Darab"}</span><input id="${prefix}D" type="number" inputmode="decimal" min="0" step="1" data-f="f.${prefix}D" value="${esc(S.f[prefix+"D"]??"")}"></label></div>`;

function readQty(prefix, it){
  const k = S.f[prefix+"K"], dd = S.f[prefix+"D"];
  if((k==null||k==="") && (dd==null||dd==="")) return null;
  const kk = num(k), d = num(dd);
  if(kk !== Math.floor(kk)) return "karton";
  if(d !== Math.floor(d)) return "krem";
  return kk*PC(it) + d;
}
function countOptions(cur, max){ max = Math.max(max||150, cur + 50); let h = ""; for(let v=0; v<=max; v++) h += `<option value="${v}" ${v===cur?"selected":""}>${v}</option>`; return h; }
function wasteOptions(it){
  const cur = it.stock||0; if(cur <= 0) return `<option value="" disabled>Nincs készleten</option>`;
  const vals = []; for(let v = 1; v <= cur + 1e-9; v += 1) vals.push(Math.round(v*100)/100);
  return vals.map(v=>`<option value="${v}">${fmtN(v)} ${U(it)}</option>`).join("");
}
function qtyOptions(it){
  const cur = Math.round((it.stock||0)*100)/100, max = Math.max(60, Math.ceil(cur) + 40), vals = [];
  const half = false;
  for(let v=0; v<=max; v+= (half && v<20) ? 0.5 : 1) vals.push(Math.round(v*100)/100);
  if(!vals.includes(cur)) { vals.push(cur); vals.sort((a,b)=>a-b); }
  return vals.map(v=>`<option value="${v}" ${v===cur?"selected":""}>${fmtN(v)} ${U(it)}</option>`).join("");
}
function lastChange(it){ let t = it.changedAt || 0; for(const m of S.moves){ if(m.itemId===it.id){ t = Math.max(t, m.at||0); break; } } return t || it.createdAt || 0; }
function pinnedIds(){ return (S.cfg.pinned||[]).filter(id => S.items.some(i => i.id===id)).slice(0,3); }
function sortedItems(){
  const abc = (a,b)=> a.name.localeCompare(b.name,"hu");
  if(S.sortMode==="recent"){ const pin = pinnedIds(); const pi = id => { const i = pin.indexOf(id); return i<0 ? 99 : i; };
    return [...S.items].sort((a,b)=> (pi(a.id)-pi(b.id)) || (lastChange(b)-lastChange(a)) || abc(a,b)); }
  const pin = pinnedIds(); const pi = id => { const i = pin.indexOf(id); return i<0 ? 99 : i; };
  return [...S.items].sort((a,b)=> (pi(a.id)-pi(b.id)) || abc(a,b));
}

function allCashTotals(){ return S.cash.map(c=>({d:c.date, t:cashTotal(c)})).filter(x=>x.t!=null); }
function periodBest(filterFn){ const xs = allCashTotals().filter(x=>filterFn(x.d)).sort((a,b)=> b.t-a.t); return xs[0] || null; }
function qOf(d){ return Math.floor((+d.slice(5,7)-1)/3); }
function allTimeInfo(){ const base = (S.cfg.allTime && +S.cfg.allTime.amount) || 0; const best = periodBest(()=>true); return { base, best: best && best.t > base ? best : null, amount: Math.max(base, best?best.t:0) }; }
function yearBase(y){ const yt = S.cfg.yearTop; if(yt && yt.year === y) return +yt.amount || 0; if(y === "2026") return (S.cfg.allTime && +S.cfg.allTime.amount) || 0; return 0; }
function cashBadges(date){
  const t = today(), out = [];
  const at = allTimeInfo(); if((at.best && at.best.d === date) || (!at.best && S.cfg.allTime && S.cfg.allTime.date === date)) out.push("all");
  const y = date.slice(0,4), curY = t.slice(0,4) === y;
  if(+y > 2026 && (!curY || +t.slice(5,7) >= 2)){ const b = periodBest(d=>d.slice(0,4)===y), yt = S.cfg.yearTop; if(b && b.d===date && (b.t > yearBase(y) || (yt && yt.year===y && yt.date===date))) out.push("year"); }
  const q = qOf(date), curQ = curY && qOf(t)===q;
  if(!curQ || (+t.slice(5,7)-1)%3 >= 1){ const b = periodBest(d=>d.slice(0,4)===y && qOf(d)===q); if(b && b.d===date) out.push("quarter"); }
  const mk = date.slice(0,7), curM = t.slice(0,7)===mk;
  if(!curM || +t.slice(8,10) >= 8){ const b = periodBest(d=>d.startsWith(mk)); if(b && b.d===date) out.push("month"); }
  return out;
}

function driveRow(c){ const r = cashCalc(c, prevCash(c.date)), d = parseYmd(c.date);
  return { date:c.date, nap:DAYS[d.getDay()], close:c.close, card:c.card, exp:r.exp, expList:(c.exp||[]).map(e=>`${e.name}: ${e.amt}`).join("; "), wd:r.wd, wdList:(c.wd||[]).map(e=>`${e.note||"kivét"}: ${e.amt}${e.by?" ("+staffName(e.by)+")":""}`).join("; "), cashT:r.cashT, total:r.total, by:staffName(c.by), at:c.at ? new Date(c.at).toLocaleString("hu-HU") : "" }; }
async function drivePush(dates){
  const dv = S.drive; if(BACKEND!=="fb" || !dv || !dv.url || !dv.key) return null;
  const rows = S.cash.filter(c => !dates || dates.includes(c.date)).sort((a,b)=> a.date<b.date?-1:1).map(driveRow);
  if(!rows.length) return 0;
  const res = await fetch(dv.url, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify({key:dv.key, rows})});
  const j = await res.json().catch(()=>({}));
  if(!j.ok) throw new Error(j.error || ("HTTP " + res.status));
  return rows.length;
}
function driveAfterSave(date){ const next = S.cash.filter(c => c.date > date).sort((a,b)=> a.date<b.date?-1:1)[0];
  drivePush([date, ...(next ? [next.date] : [])]).catch(e => toast("A Google Táblázatba írás nem sikerült (" + (e.message||e) + "). Beállítások → Összes küldése.")); }
async function saveCashDraft(){
  const c = S.cashDraft; if(!c) return;
  const exp = c.exp.filter(e => num(e.amt)).map(e => ({name:(e.name||"").trim()||"Kiadás", amt:num(e.amt)}));
  const wd = c.wd.filter(e => num(e.amt)).map(e => ({note:(e.note||"").trim(), amt:num(e.amt), by:e.by||S.me}));
  const old = S.cash.find(x=>x.date===S.cashDate), oldTot = old ? cashTotal(old) : null;
  const doc = {date:S.cashDate, close: c.close===""||c.close==null ? null : num(c.close), card: c.card===""||c.card==null ? null : num(c.card), exp, wd, ...by()};
  const i = S.cash.findIndex(x=>x.date===S.cashDate); if(i>=0) S.cash[i]=doc; else S.cash.push(doc); render();
  await write("cash/"+S.cashDate, r=>r.set(doc));
  driveAfterSave(doc.date);
  const tot = cashTotal(doc), base = (S.cfg.allTime && +S.cfg.allTime.amount) || 0;
  if(tot == null || tot === oldTot){ toast("Mentve."); return; }
  const yy = doc.date.slice(0,4), yNew = tot > yearBase(yy) && !allCashTotals().some(x => x.d!==doc.date && x.d.slice(0,4)===yy && x.t >= tot);
  const bsBefore = cashBadges(doc.date);   // badges computed against the previous yearly record
  if(yNew) await saveCfg({yearTop:{year:yy, amount:tot, date:doc.date, by:S.me, at:Date.now()}}).catch(()=>{});
  if(tot > base && !allCashTotals().some(x=> x.d!==doc.date && x.t >= tot)){
    celebrate("all", tot);
    await saveCfg({allTime:{amount:tot, date:doc.date, by:S.me, at:Date.now()}}).catch(()=>{});
  } else {
    const bs = bsBefore;
    const best = ["year","quarter","month"].find(k=>bs.includes(k));
    const pd = parseYmd(doc.date), wsd = addDays(pd, -((pd.getDay()+6)%7)), fri = ymd(addDays(wsd,4)), wkDays = [...Array(7)].map((_,i)=>ymd(addDays(wsd,i)));
    const wkBest = today() >= fri && allCashTotals().filter(x=>wkDays.includes(x.d) && x.d!==doc.date).every(x=> x.t < tot);
    if(best) celebrate(best, tot, doc.date); else if(wkBest) celebrate("week", tot, doc.date); else toast("Kasszazárás mentve.");
  }
}

  <button class="btn" data-act="fridgeAdd">Hűtő hozzáadása</button></section>
  ${BACKEND==="fb" ? `<section class="card"><h3>Jogosultságok</h3><p class="small muted">Mindenki a saját e-mail címével lép be. Az admin a Kollégák listában beírja a címet, utána a kolléga az appban a Regisztráció fülön saját jelszót választ, és a kapott levélben megerősíti a címét. Elfelejtett jelszót a belépő képernyőn lehet kérni. <b>Dolgozó:</b> napi munka. <b>Adminisztrátor:</b> beállítások és kasszazárás. <b>Csak olvasás:</b> mindent lát (kasszazárást is), de semmit nem módosíthat. <b>Admin (főfiók):</b> mindez, plusz a jogosultságok kiosztása. A jogosultságot az Admin főfiók állítja a Kollégák listában. Kilépni a jobb felső sarokban, a névre kétszer koppintva lehet.</p>${Object.keys(trustMap()).length?`<button class="btn ghost" style="width:100%" data-act="forgetLogins">Megjegyzett belépések törlése ezen a telefonon</button>`:""}</section>` : isOwnerish()?`<section class="card"><h3>Admin PIN</h3><p class="small muted">A második adminisztrátor ezzel lép be a saját telefonján. ${S.cfg.adminPin?"Beállítva.":"Még nincs beállítva."}</p><div class="row"><input id="pinNew" class="grow" type="password" inputmode="numeric" placeholder="Új PIN (legalább 4 számjegy)" data-f="f.pinNew" value="${esc(S.f.pinNew||"")}"><button class="btn" data-act="pinSet">Mentés</button></div></section>`
   :`<button class="btn ghost" data-act="adminLogout">Kilépés az admin módból</button>`}
  <section class="card"><h3>Éves rekord (${today().slice(0,4)})</h3>
    <p class="small muted">Az idei legjobb napi forgalom. Január 1-jén nulláról indul, januárban csak gyűjt, február 1-től ünnepel, ha valamelyik nap megdönti.${today().slice(0,4)==="2026" ? " <b>2026-ban még nincs éves top, az első összehasonlítás 2027. február 1-jén indul.</b>" : ""}</p>
    <div class="small">Jelenleg: <b>${ft(yearBase(today().slice(0,4)))}</b>${S.cfg.yearTop && S.cfg.yearTop.year===today().slice(0,4) && S.cfg.yearTop.date ? ` (${fmtDay(S.cfg.yearTop.date)})` : " (kézzel beállítva)"}</div>
    <div class="row"><input id="ytAmt" class="grow" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="Új összeg, Ft" data-f="f.ytAmt" value="${esc(S.f.ytAmt||"")}"><button class="btn" data-act="ytSave">Mentés</button></div></section>
  <section class="card"><h3>Über brutális all-time rekord</h3>
    <p class="small muted">A legjobb napi forgalom valaha. Ha egy zárás túllépi, az app magától frissíti és gratulál.</p>
    <div class="small">Jelenleg: <b>${ft(allTimeInfo().amount)}</b>${S.cfg.allTime && S.cfg.allTime.date ? ` (${fmtDay(S.cfg.allTime.date)})` : S.cfg.allTime ? " (kézzel beállítva)" : ""}</div>
    <div class="row"><input id="atAmt" class="grow" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="Új összeg, Ft" data-f="f.atAmt" value="${esc(S.f.atAmt||"")}"><button class="btn" data-act="atSave">Mentés</button></div>
    <span class="label">Ünneplés kipróbálása</span>
    <div class="row"><button class="btn sm" data-act="celebDemo" data-l="week">Heti top</button><button class="btn sm" data-act="celebDemo" data-l="month">Havi top</button><button class="btn sm" data-act="celebDemo" data-l="quarter">Negyedéves</button><button class="btn sm" data-act="celebDemo" data-l="year">Éves</button><button class="btn sm warn" data-act="celebDemo" data-l="all">All-time</button></div></section>
  ${BACKEND==="fb" && isOwnerish() ? importCard() : ""}
  ${closedCal()}
  </div>`;
}

/* ---------- actions ---------- */
const cfgRef = "config/main";
async function saveCfg(patch){ const next = Object.assign({}, S.cfg, patch); next.emails = staffEmails(next.staff); S.cfg = next; render(); await write(cfgRef, r => r.set(next)); }
const RO_FIELDS = new Set(["cashDate","tempDate","f.pinIn2","f.pinA","f.pinB","f.pinTrust","f.lgEm","f.lgPw"]);
const RO_OK = new Set(["nav","goSub","fbLogin","pickMe","pinBack","pinEnter","pinCreate","switchMe","fbLogout","fbRetry","lgMode","fbVerified","fbResend","dismiss","sound","wake","personCal","personCalClose","personMonth","week","shiftHist","shiftHistClose","calStep","invTab","itemOpen","ologStep","bakeToggle","bakeOrdToggle","wasteStep","movesFilter","sortMode","celebDemo","cashWeek","stockStep","msgOpen","unStep","unOpen","goUnavail","ologOpen","goLeltar","cashPopClose","cashOfferLater","goShift","invClose","forgetLogins"]);
const A = {
  nav(d){ S.tab = d.tab; S.sub = null; S.personCal = null; window.scrollTo(0,0); render(); },
  goSub(d){ S.tab = "more"; S.sub = d.sub || null; if(d.sub==="cash") S.cashDraft=null; window.scrollTo(0,0); render(); if(d.sub==="msgs") markRead(); },
  invStart(){ const lt = leltarToday() || {name:"Soron kívüli leltár", items:S.items};
    const ids = lt.items.filter(i => i.lastCountDate !== today()).sort((a,b)=>a.name.localeCompare(b.name,"hu")).map(i => i.id);
    if(!ids.length) return toast("Minden tétel meg van számolva mára.");
    S.inv = {name: lt.name, ids, i:0, n:0, skipped:0}; window.scrollTo(0,0); render(); },
  async invOk(){ const inv = S.inv; if(!inv) return; inv.zero = null; const it = S.items.find(x => x.id === inv.ids[inv.i]); inv.i++; inv.n++; render(); if(it) await countItem(it, num(it.stock||0)).catch(()=>{}); },
  cashOfferGo(){ S.snooze[CASH_ID()] = Date.now() + 60*60000; S.alarmFor = null; renderAlarm(); S.cashDate = today(); S.cashDraft = null; A.goSub({sub:"cash"}); },
  cashOfferLater(){ S.snooze[CASH_ID()] = Date.now() + 15*60000; lastBeep[CASH_ID()] = 0; S.alarmFor = null; render(); },
  invAlarmStart(){ S.snooze[INV_ID()] = Date.now() + 15*60000; lastBeep[INV_ID()] = 0; S.alarmFor = null; renderAlarm(); A.invStart(); },
  async invZeroOk(){ const inv = S.inv; if(!inv || !inv.zero) return; const it = S.items.find(x => x.id === inv.zero); inv.zero = null; if(!it || inv.ids[inv.i] !== it.id) return render(); inv.i++; inv.n++; render(); await countItem(it, 0).catch(()=>{}); toast(`${it.name}: 0`); },
  invZeroNo(){ if(S.inv){ S.inv.zero = null; render(); } },
  invSkip(){ if(!S.inv) return; S.inv.zero = null; S.inv.i++; S.inv.skipped++; render(); },
  invClose(){ S.inv = null; S.tab = "home"; S.sub = null; window.scrollTo(0,0); render(); },
  goLeltar(){ S.tab="stock"; S.invTab="leltar"; render(); },
  async fbLogin(){ const em = (S.f.lgEm||"").trim(), pw = S.f.lgPw || ""; if(!em || !pw) return toast("Add meg az e-mailt és a jelszót.");
    S.loginErr = ""; S.loginOk = ""; try{ await firebase.auth().signInWithEmailAndPassword(em, pw); delete S.f.lgPw; }catch(e){ S.loginErr = authMsg(e); render(); } },
  lgMode(d){ S.lgMode = d.m; S.loginErr = ""; S.loginOk = ""; delete S.f.lgPw; delete S.f.lgPw2; render(); },
  async fbRegister(){ const em = (S.f.lgEm||"").trim(), a = S.f.lgPw || "", b = S.f.lgPw2 || ""; S.loginErr = ""; S.loginOk = "";
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) { S.loginErr = "Adj meg egy érvényes e-mail címet."; return render(); }
    if(a.length < 6) { S.loginErr = "A jelszó legalább 6 karakter legyen."; return render(); }
    if(a !== b) { S.loginErr = "A két jelszó nem egyezik."; return render(); }
    try{ const c = await firebase.auth().createUserWithEmailAndPassword(em, a); delete S.f.lgPw; delete S.f.lgPw2; S.lgMode = "in"; await c.user.sendEmailVerification().catch(()=>{}); }
    catch(e){ S.loginErr = authMsg(e); render(); } },
  async fbReset(){ const em = (S.f.lgEm||"").trim(); S.loginErr = ""; S.loginOk = ""; if(!em){ S.loginErr = "Add meg az e-mail címed."; return render(); }
    try{ await firebase.auth().sendPasswordResetEmail(em); S.loginOk = "Elküldtük a levelet. Kattints a benne lévő linkre, állíts be új jelszót, majd lépj be vele."; }
    catch(e){ if(e.code === "auth/user-not-found") S.loginOk = "Ha ezzel a címmel van regisztráció, elküldtük a levelet. Ha még nem regisztráltál, válaszd a Regisztráció fület."; else S.loginErr = authMsg(e); } render(); },
  async fbResend(){ const u = firebase.auth().currentUser; if(!u) return; try{ await u.sendEmailVerification(); toast("Levél újraküldve."); }catch(e){ toast(e.code==="auth/too-many-requests" ? "Túl sok kérés, várj pár percet." : "Nem sikerült elküldeni."); } },
  async fbVerified(){ const u = firebase.auth().currentUser; if(!u) return; S.loginErr = ""; try{ await u.reload(); }catch(e){}
    if(!firebase.auth().currentUser.emailVerified){ S.loginErr = "Még nincs megerősítve. Kattints a levélben lévő linkre, aztán próbáld újra."; return render(); }
    await firebase.auth().currentUser.getIdToken(true).catch(()=>{}); S.needVerify = false; startData(); render(); },
  fbRetry(){ location.reload(); },
  async fbLogout(){ try{ await firebase.auth().signOut(); }catch(e){} ls.del("bufe.me"); location.reload(); },
  pickMe(d){ const st = S.cfg.staff.find(x=>x.id===d.id);
    if(BACKEND==="fb" && needsPin(st) && trusted(d.id)){ S.me = d.id; ls.set("bufe.me", d.id); S.unlockedId = d.id; render(); return; }
    if(BACKEND==="fb" && needsPin(st)){ S.pinFor = d.id; delete S.f.pinIn2; delete S.f.pinA; delete S.f.pinB; render(); setTimeout(()=>{ const el = $("#pinIn2") || $("#pinA"); el && el.focus(); }, 0); return; }
    S.me = d.id; ls.set("bufe.me", d.id); S.adminUnlocked = false; ls.del("bufe.admin"); S.unlockedId = ""; render(); },
  pinBack(){ S.pinFor = null; S.me = ""; ls.del("bufe.me"); render(); },
  async pinEnter(){ const s = S.cfg.staff.find(x=>x.id===S.pinFor); if(!s) return; const h = await pinHash(s.id, S.f.pinIn2||"");
    if(h !== s.pinHash) return toast("Hibás jelszó.");
    rememberLogin(s.id, h); S.me = s.id; ls.set("bufe.me", s.id); S.unlockedId = s.id; S.pinFor = null; delete S.f.pinIn2; render(); },
  async pinCreate(){ const s = S.cfg.staff.find(x=>x.id===S.pinFor); if(!s) return; const a = S.f.pinA||"", b = S.f.pinB||"";
    if(a.length < 4) return toast("A jelszó legalább 4 karakter legyen."); if(a !== b) return toast("A két jelszó nem egyezik.");
    const h = await pinHash(s.id, a); await saveCfg({staff: S.cfg.staff.map(x => x.id===s.id ? {...x, pinHash:h} : x)});
    rememberLogin(s.id, h); S.me = s.id; ls.set("bufe.me", s.id); S.unlockedId = s.id; S.pinFor = null; delete S.f.pinA; delete S.f.pinB; render(); toast("Jelszó beállítva."); },
  async staffRole(d, el){ const r = el.value, s = S.cfg.staff.find(x=>x.id===d.id); if(!s) return;
    if(roleOf(s)==="owner" && r!=="owner" && S.cfg.staff.filter(x=>roleOf(x)==="owner").length<=1) { render(); return toast("Legalább egy Admin (főfiók) kell."); }
    await saveCfg({staff: S.cfg.staff.map(x => x.id===d.id ? {...x, role:r, admin:(r==="admin"||r==="owner")} : x)}); toast(`${s.name}: ${roleName(r)}`); },
  async staffPinReset(d){ const s = S.cfg.staff.find(x=>x.id===d.id); if(!s) return; await saveCfg({staff: S.cfg.staff.map(x => { if(x.id!==d.id) return x; const y = {...x}; delete y.pinHash; return y; })}); toast(`${s.name}: jelszó törölve, a következő belépéskor újat kell megadni.`); },
  switchMe(){ if(BACKEND==="fb"){ if(S.logoutAsk && Date.now() - S.logoutAsk < 4000) return A.fbLogout(); S.logoutAsk = Date.now(); return toast(`${(meStaff()||{}).name||""} – koppints még egyszer a kilépéshez.`); }
    S.me = ""; ls.del("bufe.me"); S.unlockedId = ""; S.pinFor = null; render(); },
  async staffEmail(d){ const s = S.cfg.staff.find(x=>x.id===d.id); if(!s) return; const em = normEm(S.f["em_"+d.id] ?? s.email);
    if(em && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) return toast("Érvénytelen e-mail cím.");
    if(em && S.cfg.staff.some(x => x.id!==d.id && normEm(x.email)===em)) return toast("Ez a cím már egy másik kollégánál szerepel.");
    delete S.f["em_"+d.id]; await saveCfg({staff: S.cfg.staff.map(x => { if(x.id!==d.id) return x; const y = {...x}; if(em) y.email = em; else delete y.email; return y; })}); toast(em ? `${s.name}: ${em} – most már regisztrálhat.` : `${s.name}: e-mail törölve.`); },
  forgetLogins(){ ls.del("bufe.trust"); S.unlockedId = S.me; render(); toast("A megjegyzett belépések törölve ezen a telefonon."); },
  dismiss(d){ S.notices.splice(+d.i,1); render(); },
  sound(){ unlockSound(); beep(); render(); toast(S.soundOn?"Hang bekapcsolva":"A hang ezen az eszközön nem érhető el"); },
  async wake(){ try{ if(S.wake){ await S.wake.release(); S.wake=null; } else { S.wake = await navigator.wakeLock.request("screen"); S.wake.addEventListener("release", ()=>{ S.wake=null; render(); }); } }catch(e){ toast("A képernyő ébren tartása itt nem érhető el."); } render(); },
  orderEdit(d){ const o = S.orders.find(x=>x.id===d.id); if(!o) return; S.tab="order"; S.orderFormOpen = true;
    Object.assign(S.f, {oEditId:o.id, oName:o.name, oPhone:o.phone||"", oItems:o.items, oDate:o.date, oTime:o.time, oRem:o.remindMin, oNote:o.note||""}); window.scrollTo(0,0); render(); },
  newOrder(){ S.tab="order"; S.orderFormOpen = true; ["oEditId","oName","oPhone","oItems","oNote"].forEach(k=>delete S.f[k]); S.f.oDate = today(); render(); setTimeout(()=>{ const el=$("#oName"); el && el.focus(); },0); },
  orderCancel(){ S.orderFormOpen=false; ["oEditId","oName","oPhone","oItems","oNote"].forEach(k=>delete S.f[k]); render(); },
  async orderSave(){
    const f = S.f, name=(f.oName||"").trim(), items=(f.oItems||"").trim(), date=f.oDate||today(), time=f.oTime||"09:00", rem=+(f.oRem||30);
    if(!name) return toast("Add meg a vevő nevét.");
    if(!items) return toast("Írd be, mit rendelt.");
    if(date < today() && !f.oEditId) return toast("Múltbeli napra nem vehető fel rendelés.");
    if(f.oEditId){
      const o = S.orders.find(x=>x.id===f.oEditId); if(!o) return;
      const keys = ["name","phone","items","date","time","remindMin","note"], next = {name, phone:(f.oPhone||"").trim(), items, date, time, remindMin:rem, note:(f.oNote||"").trim()};
      const before = {}; keys.forEach(k=>{ if(String(o[k]??"")!==String(next[k]??"")) before[k] = o[k] ?? ""; });
      if(!Object.keys(before).length){ S.orderFormOpen=false; render(); return toast("Nincs változás."); }
      const edits = [...(o.edits||[]), {by:S.me, at:Date.now(), before}].slice(-30);
      Object.assign(o, next, {edits, by:S.me, at:Date.now()}); delete lastBeep[o.id]; delete S.snooze[o.id];
      ["oEditId","oName","oPhone","oItems","oNote"].forEach(k=> delete f[k]); S.orderFormOpen=false; render();
      await write("orders/"+o.id, r => r.update({...next, edits, by:S.me, at:Date.now()})); return toast("Rendelés módosítva.");
    }
    const o = { name, phone:(f.oPhone||"").trim(), items, date, time, remindMin:rem, note:(f.oNote||"").trim(), status:"nyitott", createdBy:S.me, createdAt:Date.now(), by:S.me, at:Date.now() };
    const id = uid(); o.id = id; S.orders = [...S.orders, o]; ["oName","oPhone","oItems","oNote"].forEach(k=> delete f[k]); S.orderFormOpen=false; render();
    await write("orders/"+id, r => r.set(o)); toast(`Mentve. ${rem} perccel ${time} előtt jelez.`);
  },
  async orderStatus(d){ const o = S.orders.find(x=>x.id===d.id); if(!o) return; o.status = d.st; o.by=S.me; o.at=Date.now(); if(d.st==="kesz"){ o.doneBy=S.me; o.doneAt=Date.now(); } if(S.alarmFor===o.id) S.alarmFor=null; render();
    await write("orders/"+d.id, r => r.update({status:d.st, by:S.me, at:Date.now(), ...(d.st==="kesz"?{doneBy:S.me, doneAt:Date.now()}:{})})); },
  snooze(d){ S.snooze[d.id] = Date.now() + (Number(d.min)||5)*60000; lastBeep[d.id] = 0; S.alarmFor = null; render(); },
  goShift(d){ const target = parseYmd(d.date), wd = (target.getDay()+6)%7; const ws = addDays(target, -wd); ws.setHours(0,0,0,0);

    setTimeout(()=>{ const el = document.querySelector(`[data-act="shiftAdd"][data-date="${d.date}"]`); el && el.closest(".dcard").scrollIntoView({block:"center"}); },0); },
  personCal(d){ const ws = weekStart(S.weekOff); S.personCal = {id:d.id, y:ws.getFullYear(), m:ws.getMonth()}; window.scrollTo(0,0); render(); },
  personCalClose(){ S.personCal = null; render(); },
  personMonth(d){ const pc = S.personCal; const x = new Date(pc.y, pc.m + (+d.d), 1); pc.y = x.getFullYear(); pc.m = x.getMonth(); render(); },
  week(d){ S.weekOff = d.d==="0" ? 0 : S.weekOff + (+d.d); S.shiftForm=null; render(); },
  shiftAdd(d){ S.shiftForm = { date:d.date, staffId: shiftStaffOn(d.date).some(x=>x.id===S.me) ? S.me : ((shiftStaffOn(d.date)[0]||{}).id||""), start:"06:00", end:"11:00", i:null }; S.shiftHist=null; render(); },
  shiftEdit(d){ const e = shiftOf(d.date)[+d.i]; S.shiftForm = { date:d.date, staffId:e.staffId, start:e.start, end:e.end, i:+d.i }; S.shiftHist=null; render(); },
  shiftCancel(){ S.shiftForm=null; render(); },
  async shiftSave(){ const f = S.shiftForm, es = [...shiftOf(f.date)]; const e = {staffId:f.staffId, start:f.start, end:f.end};

  async shiftSaveAdd(){ const f = S.shiftForm, es = [...shiftOf(f.date)]; const e = {staffId:f.staffId, start:f.start, end:f.end};
    if(es.some((x,i)=> x.staffId===f.staffId && i!==f.i)) return toast(`${staffName(f.staffId)} már be van osztva erre a napra.`);
    if(f.i==null) es.push(e); else es[f.i] = e; es.sort((a,b)=> a.start<b.start?-1:1);

    if(!next) toast("Mindenki be van osztva erre a napra.");

  async shiftDel(){ const f = S.shiftForm, es = shiftOf(f.date).filter((_,i)=> i!==f.i); S.shiftForm=null; await setShift(f.date, es); },

async function toggleClosed(date){
  const open = new Set(S.cfg.openDays||[]), closed = new Set(S.cfg.closedDays||[]);
  if(holidayName(date)){ open.has(date) ? open.delete(date) : open.add(date); closed.delete(date); }
  else { closed.has(date) ? closed.delete(date) : closed.add(date); }
  await saveCfg({openDays:[...open], closedDays:[...closed]});
}

      for(let i=0;i<8;i++) click(bt + i*beat/2, 7000, i%2? .05 : .09);
      tone(N(bass[b%4]), bt, .45, "triangle", .22, 600); tone(N(bass[b%4]+7), bt+1.5*beat, .4, "triangle", .2, 600); tone(N(bass[b%4]+12), bt+3*beat, .4, "triangle", .18, 600);
      [1,2.5].forEach(o => ch.forEach(n => tone(N(n), bt+o*beat, .25, "square", .045, 1600)));
      if(b>=1){ for(let i=0;i<8;i++) tone(N(mel[((b-1)%4)*8+i]), bt+i*beat/2, beat/2*.9, "sawtooth", .07, 2200); }
    }
    const end = T + bars*4*beat; [60,64,67,72,76].forEach(n=> tone(N(n), end, 2.2, "sawtooth", .08, 2000)); click(end, 3000, .3);
  }
  return { stop(){ const now = ctx.currentTime; out.gain.setTargetAtTime(0.0001, now, .08); setTimeout(()=>{ nodes.forEach(n=>{ try{ n.stop(); }catch(e){} }); out.disconnect(); }, 400); } };
}

/* ---------- drag & drop (custom item order) ---------- */
let dragState = null, pendingRender = false;
document.addEventListener("pointerdown", e => {
  const h = e.target.closest(".drag"); if(!h) return;
  const row = h.closest(".item"), list = row && row.parentElement; if(!row) return;
  e.preventDefault();
  try{ h.setPointerCapture(e.pointerId); }catch(_){}
  dragState = { row, list, handle:h, pid:e.pointerId };
  row.classList.add("dragging");
});
document.addEventListener("pointermove", e => {
  if(!dragState || e.pointerId !== dragState.pid) return;
  e.preventDefault();
  const { row, list } = dragState, y = e.clientY;
  const others = [...list.children].filter(c => c !== row);
  let before = null;
  for(const c of others){ const r = c.getBoundingClientRect(); if(y < r.top + r.height/2){ before = c; break; } }
  if(before){ if(row.nextElementSibling !== before) list.insertBefore(row, before); } else if(list.lastElementChild !== row) list.appendChild(row);
  if(y < 90) window.scrollBy(0, -12); else if(y > window.innerHeight - 110) window.scrollBy(0, 12);
}, {passive:false});
async function endDrag(e){
  if(!dragState || (e && e.pointerId !== dragState.pid)) return;
  const { row, list } = dragState; row.classList.remove("dragging");
  const order = [...list.children].map(c => c.dataset.iid).filter(Boolean);
  dragState = null;
  const prev = JSON.stringify(sortedItems().map(i=>i.id));
  if(JSON.stringify(order) !== prev){ S.cfg.itemOrder = order; pendingRender = false; render(); await write(cfgRef, r => r.update({itemOrder: order})).catch(()=>{}); toast("Sorrend mentve."); }
  else if(pendingRender){ pendingRender = false; render(); }
}
document.addEventListener("pointerup", endDrag);
document.addEventListener("pointercancel", endDrag);

function wire(){

    firstShift = false; const m = {}; q.docs.forEach(x => { const d = x.data(); m[d.date||x.id] = d; }); S.shifts = m; render(); }, err);

  db.collection("temps").orderBy("date","desc").limit(62).onSnapshot(q => { S.temps = q.docs.map(x=>x.data()); render(); }, err);
  db.collection("messages").orderBy("at","desc").limit(40).onSnapshot(q => { S.msgs = q.docs.map(x=>({id:x.id, ...x.data()})); render(); if(S.sub==="msgs") markRead(); }, err);
  if(BACKEND==="fb") subWaste();
  else db.collection("moves").where("type","==","selejt").orderBy("at","desc").limit(1000).onSnapshot(q => { S.wasteLog = q.docs.map(x=>({id:x.id, ...x.data()})); if(S.tab==="stock") render(); }, err);

async function importData(file){
  const data = JSON.parse(await file.text()); const fs = firebase.firestore(); const ops = [];
  for(const [coll, docs] of Object.entries(data.collections || {})) for(const [id, d] of Object.entries(docs)) ops.push([coll + "/" + id, d]);
  if(!ops.length) throw new Error("üres fájl");
  let done = 0; S.impMsg = `Importálás: 0 / ${ops.length}…`; render();
  for(let i = 0; i < ops.length; ){ const b = fs.batch(); let bytes = 0, n = 0;
    while(i < ops.length && n < 400 && bytes < 3000000){ const [p, d] = ops[i]; bytes += JSON.stringify(d).length; b.set(fs.doc(p), d); i++; n++; }
    await b.commit(); done = i; S.impMsg = `Importálás: ${done} / ${ops.length}…`; render(); }
  S.impMsg = `Kész: ${ops.length} bejegyzés importálva.`; loadAudio(); render();
}

  });
}
async function boot(){
