function opts(it, s){ const o = [];
  if(it.vars && it.nameVar === undefined){ const n = it.vars.find(x=>x.k===s.v).n; o.push(it.keep ? n : n.toLowerCase()); }
  if(it.sauce){ const x = ["Ketchup","Mustár","Majonéz"].filter(k=>s.sauces[k]); if(x.length) o.push("szósz: " + x.join(" + ").toLowerCase()); }
  if(it.cheese && s.cheese!=="none") o.push(it.cheese.find(c=>c.k===s.cheese).n.toLowerCase());
  (it.extras||[]).forEach(e => { if(s.extras[e.k]) o.push(e.n.toLowerCase()); });
  if(it.ingr){ const w = it.ingr.filter(x=>s.without[x]); if(w.length) o.push(w.map(x=>x.toLowerCase()).join(", ") + " nélkül"); }
  if(s.note && s.note.trim()) o.push("„" + s.note.trim().slice(0,80) + "”");
  if(s.hot) o.push(HOT[s.hot]);
  return o; }

const addDocs = () => addIds().map(id => S.adds[id] && Object.assign({id}, S.adds[id])).filter(Boolean);
const LOY_N = 10, LOY_EXP = 183*86400000;
const loyConsent = () => ls.get("pb.loyal") === "1";
function loyFresh(d){ if(!d || !d.last || d.last < Date.now() - LOY_EXP) return {f:[], c:[], last:0}; return {f:d.f||[], c:d.c||[], last:d.last}; }
function loyRewards(list){ const m = new Map(); list.slice(0, LOY_N).forEach(x => (x.it || [x]).forEach(i => { if(!m.has(i.k)) m.set(i.k, i); })); return [...m.values()]; }
let unsubLoy = null;
async function watchLoy(){ if(unsubLoy){ unsubLoy(); unsubLoy = null; } const ph = normPhone(ls.get("pb.phone")); if(!ph || !loyConsent() || !db) { S.loy = null; return; }
  const k = await sha("pl:" + ph); if(!k) return; S.loyPh = ph;
  unsubLoy = db.collection("loyalty").doc(k).onSnapshot(sn => { S.loy = loyFresh(sn.exists ? sn.data() : null); if(S.screen === "menu" || S.screen === "card") { S.keepScroll = true; render(); } }, () => { S.loy = loyFresh(null); }); }

/* ---------- opening hours ---------- */
function openState(){ const d = new Date(), m = d.getHours()*60 + d.getMinutes(), td = ymd(d);
  if(S.pub.test || !S.pub.live) return {ok:true, test:true};
  if(S.pub.paused) return {ok:false, msg:"Az online rendelés most szünetel. Telefonon rendelhetsz: " + PHONE_TXT};
  const closedToday = (S.pub.closed||[]).includes(td);
  if(closedToday || m >= LAST_ORDER){ let n = new Date(d); for(let i=0;i<14;i++){ n.setDate(n.getDate()+1); if(!(S.pub.closed||[]).includes(ymd(n))) break; }
    const day = (n.getDate() - d.getDate() === 1 || (n.getMonth()!==d.getMonth() && n.getDate()===1)) ? "holnap" : ["vasárnap","hétfőn","kedden","szerdán","csütörtökön","pénteken","szombaton"][n.getDay()];
    return {ok:false, msg:`Most zárva vagyunk – ${day} 6:00-tól rendelhetsz.`}; }
  if(m < OPEN_FROM - 60) return {ok:false, msg:"Rendelni reggel 5:00-tól lehet, 6:00-tól adjuk ki."};
  return {ok:true}; }

function go(screen){

  else { try{ if(history.state && history.state.pb) history.replaceState({pb:1}, ""); else history.pushState({pb:1}, ""); }catch(e){} }
  S.screen = screen; render(); window.scrollTo(0,0); }

    const h = await sha(ph); if(h && (S.pub.blockedH||[]).includes(h)) return go("blocked");
    const prev = S.order && !["done","rejected","noshow","cancelled"].includes(S.order.status) && S.order.at > Date.now() - 6*3600000;
    if(prev) { S.err = {send:`Már van egy folyamatban lévő rendelésed (#${S.order.no}). Várd meg, amíg elkészül, vagy hívj minket.`}; S.keepScroll = true; return render(); }
    ls.set("pb.name", name); ls.set("pb.phone", S.phone.trim());
    const doc = { no: String(100 + Math.floor(Math.random()*900)), at: Date.now(), name: name.slice(0,40), phone: ph, eat: S.eat, when,
      items: S.cart.map(r => ({id: r.id, name: r.name, opts: r.opts.slice(0,8), unit: r.unit, qty: r.qty})), total: cartTotal(), qtyTotal: cartQty(), status: "new",
      loyal: !!(S.loyOn ?? loyConsent()) };
    S.sending = true; S.keepScroll = true; render();
    try{ const ref = db.collection("weborders").doc(); await ref.set(doc);
      if(doc.loyal){ ls.set("pb.loyal", "1"); } else if(S.loyOn === false) ls.del("pb.loyal"); watchLoy();
      ls.set("pb.active", ref.id); ls.set("pb.last", JSON.stringify({items: S.cart})); S.cart = []; saveCart(); S.sending = false; S.orderId = ref.id; S.order = doc; watchOrder(ref.id); go("status"); }
    catch(e){ S.sending = false; S.err = {send: "Nem sikerült elküldeni. Ellenőrizd az internetet, vagy hívj minket: " + PHONE_TXT}; S.keepScroll = true; render(); }
  }
};
document.addEventListener("click", e => { const b = e.target.closest("[data-act]"); if(!b || b.disabled) return; const f = A[b.dataset.act]; if(f){ e.preventDefault(); f(b.dataset); } });
document.addEventListener("input", e => { const f = e.target.dataset && e.target.dataset.f; if(!f) return; if(f === "note") S.sel.note = e.target.value; else S[f] = e.target.type === "checkbox" ? e.target.checked : e.target.value;
  if(S.err[f]){ delete S.err[f]; } if(f === "time"){ S.keepScroll = true; render(); } });

/* ---------- data ---------- */
let unsubAdds = [];
function watchAdd(id){ unsubAdds.push(db.collection("weborders").doc(id).onSnapshot(s => { if(!s.exists) return; S.adds[id] = s.data(); if(S.screen === "status") render(); }, () => {})); }
function watchOrder(id){ if(unsubOrder) unsubOrder(); let first = true;
  unsubOrder = db.collection("weborders").doc(id).onSnapshot(s => { if(!s.exists){ return; } const o = s.data(), prev = S.order && S.order.status; S.order = o;
    if(first && S.screen === "menu" && !["done","rejected","noshow","cancelled"].includes(o.status) && o.at > Date.now() - 12*3600000){ try{ history.pushState({pb:1}, ""); }catch(e){} S.screen = "status"; } first = false;
    if(["accepted","ready","done"].includes(o.status)) ls.set("pb.trusted", o.phone);
    if(o.status === "ready" && prev && prev !== "ready"){ try{ navigator.vibrate && navigator.vibrate([300,150,300]); }catch(e){} }
    if(o.at < Date.now() - 12*3600000){ ls.del("pb.active"); S.order = null; }
    if(S.screen === "status" || S.screen === "menu") render(); }, () => {}); }
function boot(){
  try{ firebase.initializeApp(window.FB_CONFIG); db = firebase.firestore(); if(window.FB_EMULATOR) db.useEmulator("127.0.0.1", 8080); }catch(e){ db = firebase.firestore(); }
  db.collection("public").doc("menu").onSnapshot(s => { S.pub = Object.assign({soldOut:{}, paused:false, closed:[], blockedH:[]}, s.exists ? s.data() : {}); S.pubOk = true; if(S.screen !== "item") { S.keepScroll = true; render(); } }, () => { S.pubOk = true; });
  if(S.orderId){ watchOrder(S.orderId); addIds().forEach(watchAdd); }
  watchLoy();
  render();
  setInterval(() => { if(S.screen === "menu" || S.screen === "cart"){ S.keepScroll = true; render(); } }, 60000);
}
boot();
window.addEventListener("load", () => { if(S.screen === "card"){ S.keepScroll = true; render(); } });
</script>
